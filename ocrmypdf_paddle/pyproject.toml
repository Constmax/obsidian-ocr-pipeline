[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-paddle"
dynamic = ["version"]
description = "OCRmyPDF engine plugin: PaddleOCR PP-OCRv5 models through RapidOCR (ONNX Runtime)"
requires-python = ">=3.12"
# Pins from the runtime spike (#62, bench/ERGEBNIS.md, Nachtrag 18). The
# engine checks the installed versions at startup (runtime.PINNED_PACKAGES).
dependencies = [
    "ocrmypdf==17.8.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.26.0",
]

[project.optional-dependencies]
# --paddle-mode fast: Apple Vision reads the page (macOS only). The version
# is the one ocrmypdf-appleocr 0.3.4 runs with in the Stage-1 venv.
fast = ["pyobjc-framework-Vision==12.2.1; sys_platform == 'darwin'"]

[tool.setuptools.dynamic]
version = { attr = "ocrmypdf_paddle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
