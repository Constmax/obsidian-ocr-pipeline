[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-paddle"
dynamic = ["version"]
description = "OCRmyPDF engine plugin: PaddleOCR PP-OCRv5 models through RapidOCR (ONNX Runtime)"
requires-python = ">=3.12"
# Pins from the runtime spike (#62, bench/ERGEBNIS.md, Nachtrag 18). The
# engine checks the installed versions at startup (runtime.PINNED_PACKAGES).
dependencies = [
    "ocrmypdf==17.8.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.26.0",
]

[project.optional-dependencies]
# --paddle-mode fast: Apple Vision reads the page (macOS only). Not pinned
# exactly: ocrmypdf-appleocr 0.3.4 leaves pyobjc open, so a clean Stage-1 venv
# gets whatever 12.x is current (12.2.2 on 2026-09-30), and install-paddle.sh
# must not change it (#72). Fast mode uses no API newer than 12.2.1.
fast = ["pyobjc-framework-Vision>=12.2.1,<13; sys_platform == 'darwin'"]

[tool.setuptools.dynamic]
version = { attr = "ocrmypdf_paddle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
