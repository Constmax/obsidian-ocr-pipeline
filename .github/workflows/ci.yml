name: CI

# Every job calls a Makefile target, so `make check` runs locally what CI runs
# (Issue #107). Only toolchain installation lives here.
on:
  # push nur auf main: Feature-Branches laufen ueber ihren Pull Request.
  # Unbeschraenktes 'push' wuerde bei jedem Branch mit offenem PR jeden Job
  # doppelt starten (einmal fuer push, einmal fuer pull_request).
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin (check, lint, test, main.js-vergleich)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Typecheck, lint, test, build, main.js matches src/
        # npm ci (reproducible from package-lock.json) runs as a make prerequisite.
        run: make plugin

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck installieren
        # Feste Version statt apt: der Distributionsstand von ubuntu-latest
        # wandert, und eine neue shellcheck-Generation bringt neue Default-
        # Checks mit — sonst gehen unveraenderte Skripte ploetzlich rot.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shell-Skripte pruefen
        run: make shellcheck

  python:
    name: Python (pytest, Golden-Snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest installieren
        # pyyaml: the CLI-contract test loads the frontmatter as real YAML.
        run: pip install pytest pyyaml
      - name: pymupdf installieren
        run: pip install pymupdf
      - name: numpy und pillow installieren
        # Die Scan-Strecke (detect_layout, _ink_amount) braucht beide. Ohne sie
        # decken die Konvertierungstests nur vektorielle Seiten ab.
        run: pip install numpy pillow
      - name: pdf2md, Stage 1 and benchmark entry points
        run: make test-py PYTHON=python

  ocrmypdf:
    name: OCRmyPDF-Textlayer (gepinnt 17.8.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract und Poppler installieren
        # OCRmyPDF 17.8.0 verlangt tesseract auch dann, wenn ein Engine-Plugin
        # die Erkennung uebernimmt; pdftotext liest den Textlayer so, wie ihn
        # das Quality-Gate liest (-raw, Content-Stream-Reihenfolge).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - name: pytest und gepinntes ocrmypdf installieren
        # Dieselbe Version wie in setup.sh: der Test ruft den fpdf2-Renderer
        # direkt auf, und der ist keine oeffentliche API.
        run: pip install pytest "ocrmypdf==17.8.0"
      - name: hOCR text-layer order and the PaddleOCR engine plugin
        # ocrmypdf_paddle imports ocrmypdf and therefore runs here, not in the
        # python job; recognition is replaced in its tests.
        env:
          # Fehlende Voraussetzungen sind in diesem Job ein Fehler, kein Skip.
          REQUIRE_OCRMYPDF: "1"
        run: make test-ocrmypdf OCRMYPDF_PYTHON=python
