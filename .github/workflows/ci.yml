name: CI

on:
  # push nur auf main: Feature-Branches laufen ueber ihren Pull Request.
  # Unbeschraenktes 'push' wuerde bei jedem Branch mit offenem PR jeden Job
  # doppelt starten (einmal fuer push, einmal fuer pull_request).
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin (check, lint, test, main.js-vergleich)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Abhaengigkeiten (reproduzierbar aus package-lock.json)
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Eingecheckten Build verifizieren
        run: |
          # Erst die Versionierung pruefen: 'git diff' meldet fuer eine
          # unversionierte Datei keinen Unterschied, ein PR, der main.js
          # aus dem Index nimmt oder ignoriert, kaeme sonst gruen durch.
          if ! git ls-files --error-unmatch main.js >/dev/null 2>&1; then
            echo "!! main.js ist nicht versioniert: der eingecheckte Build ist die Auslieferung (siehe AGENTS.md)."
            exit 1
          fi
          if ! git diff --exit-code -- main.js; then
            echo "!! main.js weicht von src/ ab: 'npm run build' ausfuehren und main.js mitcommitten."
            exit 1
          fi
          echo "ok  main.js ist versioniert und entspricht src/"

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck installieren
        # Feste Version statt apt: der Distributionsstand von ubuntu-latest
        # wandert, und eine neue shellcheck-Generation bringt neue Default-
        # Checks mit — sonst gehen unveraenderte Skripte ploetzlich rot.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shell-Skripte pruefen
        run: shellcheck -x -P bin setup.sh install.sh bin/*.sh bin/pdf2md plugin/install-plugin.sh

  python:
    name: Python (pytest, Golden-Snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest installieren
        run: pip install pytest
      - name: pymupdf installieren
        run: pip install pymupdf
      - name: numpy und pillow installieren
        # Die Scan-Strecke (detect_layout, _ink_amount) braucht beide. Ohne sie
        # decken die Konvertierungstests nur vektorielle Seiten ab.
        run: pip install numpy pillow
      - name: Tests (Nahtentdopplung, Randmarken, Schleifen, Golden-Snapshot)
        run: python -m pytest pdf2md/test bin/test -q
      - name: Benchmark entry point smoke test und Lesereihenfolge-Metrik
        run: python -m pytest bench/test_entrypoints.py bench/test_reading_order.py -q

  ocrmypdf:
    name: OCRmyPDF-Textlayer (gepinnt 17.8.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract und Poppler installieren
        # OCRmyPDF 17.8.0 verlangt tesseract auch dann, wenn ein Engine-Plugin
        # die Erkennung uebernimmt; pdftotext liest den Textlayer so, wie ihn
        # das Quality-Gate liest (-raw, Content-Stream-Reihenfolge).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - name: pytest und gepinntes ocrmypdf installieren
        # Dieselbe Version wie in setup.sh: der Test ruft den fpdf2-Renderer
        # direkt auf, und der ist keine oeffentliche API.
        run: pip install pytest "ocrmypdf==17.8.0"
      - name: Textlayer folgt der hOCR-Elementreihenfolge
        env:
          # Fehlende Voraussetzungen sind in diesem Job ein Fehler, kein Skip.
          REQUIRE_OCRMYPDF: "1"
        run: python -m pytest bin/test/test_hocr_text_layer_order.py -q
      - name: PaddleOCR-Engine-Plugin (ohne RapidOCR und Modelle)
        # Das Paket importiert ocrmypdf und laeuft deshalb hier, nicht im
        # Job python. Die Erkennung ist in den Tests ersetzt.
        env:
          REQUIRE_OCRMYPDF: "1"
        run: python -m pytest ocrmypdf_paddle/test -q
